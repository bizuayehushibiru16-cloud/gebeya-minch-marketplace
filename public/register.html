<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | Gebya Minch Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      color: #071f3d;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .brand span {
      color: #c99700;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      color: #071f3d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #0b4f8a;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 45px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #071f3d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-btn:hover {
      background: #0b4f8a;
    }

    .message {
      display: none;
      padding: 11px;
      margin-bottom: 15px;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .success {
      background: #e5f7e9;
      color: #146b2e;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links p {
      font-size: 14px;
      color: #666;
    }

    .links a {
      color: #0b4f8a;
      font-weight: bold;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #071f3d;
      text-decoration: none;
      font-size: 14px;
    }

    .loading {
      opacity: .7;
      pointer-events: none;
    }

    .terms {
      font-size: 12px;
      color: #777;
      margin: 12px 0;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .container {
        margin: 10px auto;
      }

      .card {
        padding: 22px;
      }

      .brand h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>ገበያ ሚንጭ</h1>
      <span>Gebya Minch Marketplace</span>
    </div>

    <div class="card">

      <h2>Create Account</h2>

      <p class="subtitle">
        Join Gebya Minch Marketplace
      </p>

      <div id="message" class="message"></div>

      <form id="registerForm">

        <!-- NAME -->

        <div class="form-group">
          <label for="name">Full Name</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          >
        </div>


        <!-- EMAIL -->

        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          >
        </div>


        <!-- PHONE -->

        <div class="form-group">
          <label for="phone">Phone Number</label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+2519XXXXXXXX"
            required
          >
        </div>


        <!-- CITY -->

        <div class="form-group">
          <label for="city">City</label>

          <select id="city" name="city" required>

            <option value="">
              Select your city
            </option>

            <option value="Hawassa">
              Hawassa
            </option>

            <option value="Arba Minch">
              Arba Minch
            </option>

            <option value="Wolaita Sodo">
              Wolaita Sodo
            </option>

            <option value="Dilla">
              Dilla
            </option>

            <option value="Addis Ababa">
              Addis Ababa
            </option>

            <option value="Other">
              Other
            </option>

          </select>
        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
              minlength="6"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('password')"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
              minlength="6"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('confirmPassword')"
            >
              👁️
            </button>

          </div>

        </div>


        <p class="terms">
          By creating an account, you agree to use
          Gebya Minch Marketplace responsibly and
          provide accurate information.
        </p>


        <button
          type="submit"
          id="registerBtn"
          class="register-btn"
        >
          Create Account
        </button>

      </form>


      <div class="links">

        <p>
          Already have an account?

          <a href="login.html">
            Login
          </a>
        </p>

      </div>


      <a href="index.html" class="home">
        ← Back to Marketplace
      </a>

    </div>

  </div>


  <script>

    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("registerBtn");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";

    }


    function togglePassword(id) {

      const input =
        document.getElementById(id);

      if (input.type === "password") {

        input.type = "text";

      } else {

        input.type = "password";

      }

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const phone =
          document.getElementById("phone").value.trim();

        const city =
          document.getElementById("city").value;

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;


        // CHECK PASSWORD

        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;

        }


        button.textContent =
          "Creating account...";

        button.classList.add("loading");


        try {

          const response =
            await fetch(
              "/api/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  name: name,

                  email: email,

                  phone: phone,

                  city: city,

                  password: password

                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Registration failed."
            );

          }


          /*
            Save login token
          */

          if (data.token) {

            localStorage.setItem(
              "token",
              data.token
            );

          }


          if (data.user) {

            localStorage.setItem(
              "user",
              JSON.stringify(data.user)
            );

          }


          showMessage(
            "Account created successfully!",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "dashboard.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Unable to create account.",
            "error"
          );


          button.textContent =
            "Create Account";

          button.classList.remove(
            "loading"
          );

        }

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Gebya Minch Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand h1 {
      color: #071f3d;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .brand span {
      color: #c99700;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 30px;

      box-shadow:
        0 8px 30px rgba(0,0,0,.08);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #071f3d;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #d7dce2;
      border-radius: 8px;

      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #0b4f8a;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 45px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;
      cursor: pointer;

      font-size: 18px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #071f3d;
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    .login-btn:hover {
      background: #0b4f8a;
    }

    .message {
      margin-bottom: 15px;
      padding: 10px;

      border-radius: 7px;

      text-align: center;
      font-size: 14px;

      display: none;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .success {
      background: #e5f7e9;
      color: #146b2e;
    }

    .links {
      text-align: center;
      margin-top: 22px;
    }

    .links p {
      margin: 8px 0;
      font-size: 14px;
      color: #666;
    }

    .links a {
      color: #0b4f8a;
      font-weight: 700;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 20px;

      color: #071f3d;
      font-size: 14px;
      text-decoration: none;
    }

    .loading {
      opacity: .7;
      pointer-events: none;
    }

    @media (max-width: 480px) {

      .card {
        padding: 22px;
      }

      .brand h1 {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- BRAND -->

    <div class="brand">

      <h1>
        ገበያ ሚንጭ
      </h1>

      <span>
        Gebya Minch Marketplace
      </span>

    </div>


    <!-- LOGIN CARD -->

    <div class="card">

      <h2>
        Welcome Back
      </h2>

      <p class="subtitle">
        Login to your marketplace account
      </p>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message">
      </div>


      <!-- LOGIN FORM -->

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="email">

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password">

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()">

              👁️

            </button>

          </div>

        </div>


        <button
          type="submit"
          id="loginBtn"
          class="login-btn">

          Login

        </button>

      </form>


      <!-- LINKS -->

      <div class="links">

        <p>
          Don't have an account?
          <a href="register.html">
            Create Account
          </a>
        </p>

      </div>


      <a
        href="index.html"
        class="home">

        ← Back to Marketplace

      </a>

    </div>

  </div>


  <script>

    /*
      Gebya Minch Login

      The API endpoint is:
      POST /api/auth/login

      The JWT token will be saved
      in localStorage.
    */


    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginBtn");


    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display =
        "block";

    }


    function togglePassword() {

      const password =
        document.getElementById("password");

      if (
        password.type === "password"
      ) {

        password.type = "text";

      } else {

        password.type = "password";

      }

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "error"
          );

          return;

        }


        button.textContent =
          "Logging in...";

        button.classList.add(
          "loading"
        );


        try {

          /*
            Use relative API URL.

            This allows the website to work
            when frontend and backend are
            hosted on the same domain.
          */

          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Login failed."
            );

          }


          /*
            Save JWT token
          */

          localStorage.setItem(
            "token",
            data.token
          );


          /*
            Save user information
          */

          if (data.user) {

            localStorage.setItem(
              "user",
              JSON.stringify(data.user)
            );

          }


          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          /*
            Go to dashboard
          */

          setTimeout(
            function() {

              window.location.href =
                "dashboard.html";

            },
            800
          );


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Unable to login. Please try again.",
            "error"
          );


          button.textContent =
            "Login";

          button.classList.remove(
            "loading"
          );

        }

      }
    );

  </script>

</body>
</html>
